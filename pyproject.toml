[project]
name = "cloudsoc"
version = "0.1.0"
description = "Cloud Security Operations Center for Linux"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "psutil>=7.2.2",
    "rich>=15.0.0",
    "telethon>=1.44.0",
    "textual>=8.2.8",
]

[project.scripts]
cloudsoc = "cloudsoc.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudsoc"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
